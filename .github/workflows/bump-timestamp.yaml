name: Bump MIN_TIMESTAMP

on:
  schedule:
    - cron: '0 10 28 * *'

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update Constants.kt
        env:
          FILE: app/src/main/java/app/accrescent/client/data/Constants.kt
          CONSTANT: 'const val MIN_TIMESTAMP: Long'
        run: |
          TIMESTAMP=$(curl -s https://repo.accrescent.app/repodata.1.json | jq '.timestamp')
          sed -i -E "s/^$CONSTANT = [[:digit:]]*$/$CONSTANT = $TIMESTAMP/" $FILE
      - name: Create pull request
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8.1.2
        env:
          message: Bump MIN_TIMESTAMP
        with:
          title: ${{ env.message }}
          commit-message: ${{ env.message }}
          delete-branch: true
